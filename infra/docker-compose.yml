services:
  backend:
    build:
      context: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app
    env_file:
      - ../backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - traccar

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ttl
      POSTGRES_PASSWORD: ttl
      POSTGRES_DB: ttl_field
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  traccar:
    image: traccar/traccar:latest
    ports:
      - "8082:8082"
      - "5055:5055"
    volumes:
      - traccar_data:/opt/traccar/data

  frontend:
    build:
      context: ../frontend
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app

volumes:
  pg_data:
  traccar_data:
